# The curated list. scripts/build_readme.py turns this file into README.md.
#
# Each project:
#   repo    = "owner/name" on GitHub (required)
#   desc    = one neutral sentence, no marketing claims (required)
#   license = set only when GitHub cannot detect it (it reports NOASSERTION)
#   source_available = true when the main code is not under an OSI-approved license
#
# Stars, archived status and last-push dates come from the GitHub API on every build.
# Do not type them here.

